[project]
name = "agent-platform"
version = "0.1.0"
description = "Reusable starter for enterprise AI agent teams on Microsoft Agent Framework 1.x."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-openai==1.17.0",
    "agent-framework-orchestrations>=1.3.2,<2",
    "mcp>=1.24,<2",
    "opentelemetry-exporter-otlp>=1.39",
    "opentelemetry-sdk>=1.39",
]

[project.optional-dependencies]
foundry = ["agent-framework-foundry==1.15.0"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires live credentials or an external service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["agent_platform"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
