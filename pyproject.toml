[project]
name = "agentbuildkit"
version = "0.1.0"
description = "Open-source Python harness for building reliable AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "agent-framework-anthropic==1.0.0b261022",
    "agent-framework-core==1.22.0",
    "agent-framework-openai==1.17.0",
    "agent-framework-orchestrations>=1.3.2,<2",
    "httpx>=0.28,<1",
    "mcp>=1.24,<2",
    "pyjwt[crypto]>=2.10,<3",
    "opentelemetry-exporter-otlp>=1.39",
    "opentelemetry-sdk>=1.39",
]

[project.urls]
Homepage = "https://agentbuildkit.com"
Repository = "https://github.com/gluzio/agentbuildkit"
Issues = "https://github.com/gluzio/agentbuildkit/issues"

[project.optional-dependencies]
foundry = ["agent-framework-foundry==1.15.0"]
composio = ["composio==0.32.0"]

[project.scripts]
agentkit = "agentbuildkit.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.uv.workspace]
members = ["examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentbuildkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires live credentials or an external service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "examples", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "agentbuildkit",
    "agentbuildkit_templates",
    "customer_service",
    "office",
    "operations_reporting",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "examples", "tests"]
extraPaths = ["src", "examples"]
venvPath = "."
venv = ".venv"
