# Publishes agentbuildkit when a GitHub Release is published from a v* tag.
# The package version comes from pyproject.toml. PyPI authentication is
# Trusted Publishing through GitHub OIDC. This workflow stores no PyPI token.

name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Publish agentbuildkit to PyPI
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentbuildkit
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
