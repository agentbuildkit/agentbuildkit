[project]
name = "agentbuildkit-templates"
version = "0.2.0"
description = "First-party Customer Service and Operations Reporting templates for AgentBuildKit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "AgentBuildKit" }]
maintainers = [{ name = "AgentBuildKit" }]
dependencies = ["agentbuildkit>=0.2.0,<0.3.0"]

[tool.uv.sources]
agentbuildkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentbuildkit_templates"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/customer_service",
    "/office",
    "/operations_reporting",
]
