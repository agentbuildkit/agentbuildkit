[project]
name = "agentbuildkit-templates"
version = "0.1.0"
description = "First-party Customer Service and Operations Reporting templates for AgentBuildKit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Release preparation: this name does not mean the published 0.1.0 harness is
# compatible. Before publishing, require at least the first harness release
# that provides the capabilities in agentbuildkit_templates.compat.
dependencies = ["agentbuildkit"]

[tool.uv.sources]
agentbuildkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentbuildkit_templates"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/customer_service",
    "/office",
    "/operations_reporting",
]
